name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode: '16.2'
          - os: macos-15
            xcode: '16.4'
          - os: macos-26
            xcode: '26.3'
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test --disable-xctest --enable-code-coverage
      - name: Enforce complete core line coverage
        run: python3 scripts/check-coverage.py "$(swift build --show-bin-path)/codecov/LocalFlow.json"
      - name: Build and test tiny local recognition with networking denied
        run: |
          scripts/build-whisper.sh
          bash Distribution/download-model.sh
          say -v Samantha -f Tests/Fixtures/short.txt -o "$RUNNER_TEMP/short.aiff"
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/short.aiff" "$RUNNER_TEMP/short.wav"
          python3 Tests/Whisper/test_worker.py ".build/whisper-$(uname -m)/localflow-whisper" "$HOME/Library/Application Support/LocalFlow/Models/ggml-tiny.en-q5_1.bin" "$RUNNER_TEMP/short.wav"
      - name: Build native offline package and test installer
        run: |
          scripts/build-app.sh
          scripts/package.sh
          bash Tests/Installer/test-install.sh
      - name: Validate both architecture builds
        if: matrix.os == 'macos-15'
        run: |
          for architecture in arm64 x86_64; do
            ARCHITECTURE="$architecture" scripts/build-app.sh
            lipo ".build/app-$architecture/LocalFlow.app/Contents/MacOS/LocalFlow" -verify_arch "$architecture"
            ARCHITECTURE="$architecture" scripts/package.sh
          done
      # App archives remain local to the job until actual hardware acceptance.
